services:
  backend:
    image: ${BACKEND_IMAGE:-tamhk349/mern-backend:1.0}
    container_name: mern-backend-hub
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - .env

  frontend:
    image: ${FRONTEND_IMAGE:-tamhk349/mern-frontend:2.0}
    container_name: mern-frontend-hub
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
