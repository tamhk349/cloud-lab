services:
  mongo:
    image: mongo:7
    container_name: mern-mongo
    volumes:
      - mongo-data:/data/db

  backend:
    build: ../mern-demo/server
    container_name: mern-backend
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/cloud_lab
      - MONGO_URI=mongodb://mongo:27017/cloud_lab
    depends_on:
      - mongo

  frontend:
    build: ../mern-demo/client
    container_name: mern-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo-data: